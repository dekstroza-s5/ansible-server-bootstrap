- name: Install baseline packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, ufw, nginx, docker.io, python3]
    state: present
    update_cache: true

- name: Create administrative user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: "{{ admin_groups | join(',') }}"
    append: true
    shell: /bin/bash
    create_home: true

- name: Install authorized keys
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ item }}"
  loop: "{{ admin_authorized_keys }}"
  when: "'REPLACE_' not in item"

- name: Harden OpenSSH
  ansible.builtin.template:
    src: ssh-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Set default firewall policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow required TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ allowed_tcp_ports }}"

- name: Enable firewall
  community.general.ufw:
    state: enabled

- name: Enable platform services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [docker, nginx]
